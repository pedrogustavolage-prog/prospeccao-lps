<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arquitetura Áurea — background 3D exclusivo, Larissa Reis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; background:#0e0906; overflow-x:hidden; }
  #scene{ position:fixed; inset:0; width:100vw; height:100vh; }
  #scroll-host{ height:500vh; }
  #scroll-hint{
    position:fixed; bottom:28px; left:0; right:0; text-align:center;
    font-family:-apple-system,sans-serif; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:rgba(242,207,122,0.5); z-index:2; pointer-events:none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scroll-host"></div>
<div id="scroll-hint">scroll ↓</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';

/* =====================================================================
   ARQUITETURA ÁUREA — background 3D exclusivo pra Larissa Reis
   (leads/estetica-bh/larissa-reis-estetica-avancada)

   Conceito, não reskin: em vez de um "terreno" de ruído (como as
   referências que o Pedro mandou), essa cena é uma esfera de
   partículas distribuídas pelo ÂNGULO ÁUREO (~137.5°) — a mesma
   matemática que organiza sementes de girassol e escamas de pinha
   com perfeição, e que o mercado de harmonização facial já usa como
   linguagem ("proporção áurea do sorriso"). É a ideia da marca
   "Arquitetura Labial" — proporção e geometria — tornada visível,
   não uma paisagem genérica recolorida.

   Reaproveita só a infraestrutura de renderização (composer/bloom do
   Three.js — isso é encanamento, não é a ideia). Geometria, câmera,
   movimento e composição final são escritos do zero pra esse conceito.
   ===================================================================== */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const Lerp = (a, b, t) => a + (b - a) * t;
function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16);
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}

// Paleta idêntica à da LP (mesma marca, mesmas cores exatas do index.html)
const COL_BG    = '#150e0a';
const COL_CORE  = '#f6e2c4'; // champanhe — núcleo, brilho mais quente
const COL_MID   = '#f2cf7a'; // dourado — camada intermediária
const COL_OUTER = '#8a6a3f'; // gold-dark — camada externa, mais contida

const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // ~137.5077640500378°, o ângulo áureo real

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, alpha: false });
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL_BG);
scene.fog = new THREE.FogExp2(new THREE.Color(COL_BG).getHex(), 0.045);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);

const LAYERS = { SCENE: 0, BLOOM: 1 };
camera.layers.enable(LAYERS.SCENE);
camera.layers.enable(LAYERS.BLOOM);

const renderPass = new RenderPass(scene, camera);

const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(renderPass);
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.6, 0.15));

const finalPass = new ShaderPass(new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null },
    bloomTexture: { value: bloomComposer.renderTarget2.texture },
    uBg: { value: hexToVec3(COL_BG) },
    uCore: { value: hexToVec3(COL_CORE) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  // Composição final: vinheta quente + brilho suave central (sem chama emprestada de outra cena)
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D bloomTexture;
    uniform vec3 uBg; uniform vec3 uCore;
    varying vec2 vUv;
    void main(){
      vec2 uv = 2.0 * vUv - 1.0;
      float d = length(uv);
      vec3 vignette = uBg * (1.0 - 0.35 * d);
      vec3 glow = uCore * smoothstep(1.1, 0.0, d) * 0.10;
      vec3 base = texture2D(tDiffuse, vUv).xyz;
      vec3 bloom = texture2D(bloomTexture, vUv).xyz;
      gl_FragColor = vec4(vignette + glow + base + bloom, 1.0);
    }`,
}));
const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(renderPass);
finalComposer.addPass(finalPass);

// ---- Esfera áurea: 3 camadas concêntricas de partículas ----
// Cada camada usa o ângulo áureo pra distribuir pontos uniformemente
// numa esfera (algoritmo de Fibonacci sphere) — geometria de
// proporção de verdade, não ruído aleatório.
function buildGoldenShell(count, radius, color, opacity) {
  const positions = new Float32Array(count * 3);
  const seeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;          // de 1 a -1, uniforme
    const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = GOLDEN_ANGLE * i;
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;
    positions[i * 3] = x * radius;
    positions[i * 3 + 1] = y * radius;
    positions[i * 3 + 2] = z * radius;
    seeds[i] = Math.random();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uColor: { value: hexToVec3(color) },
      uOpacity: { value: opacity }, uBreath: { value: 0 }, uSize: { value: 46 },
      uCursor: { value: new THREE.Vector3(9999, 9999, 9999) }, uRepel: { value: 3.2 },
    },
    vertexShader: `
      attribute float seed;
      uniform float uTime; uniform float uBreath; uniform float uSize; uniform vec3 uCursor; uniform float uRepel;
      varying float vSeed; varying float vFlicker;
      void main(){
        vSeed = seed;
        // respiração: cada partícula pulsa levemente fora de fase da vizinha
        float breathe = 1.0 + sin(uTime * 0.5 + seed * 6.2831) * 0.04 * uBreath;
        vec3 p = position * breathe;

        vec4 world = modelMatrix * vec4(p, 1.0);
        vec3 toCursor = world.xyz - uCursor;
        float cd = length(toCursor);
        float fall = smoothstep(uRepel, 0.0, cd);
        world.xyz += normalize(toCursor + 0.0001) * fall * 1.4;

        vec4 mv = viewMatrix * world;
        vFlicker = 0.6 + 0.4 * sin(uTime * 1.3 + seed * 40.0);
        gl_PointSize = uSize * (1.0 / -mv.z) * (0.7 + 0.6 * seed);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity;
      varying float vSeed; varying float vFlicker;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float l = length(c);
        if (l > 0.5) discard;
        float a = smoothstep(0.5, 0.0, l);
        gl_FragColor = vec4(uColor, a * uOpacity * vFlicker);
      }`,
  });

  const points = new THREE.Points(geo, mat);
  points.layers.enable(LAYERS.BLOOM);
  points.frustumCulled = false;
  return { points, mat };
}

const group = new THREE.Group();
scene.add(group);

const core  = buildGoldenShell(900,  4.2, COL_CORE,  0.9);
const mid   = buildGoldenShell(1400, 8.0, COL_MID,   0.55);
const outer = buildGoldenShell(1800, 12.5, COL_OUTER, 0.32);
group.add(core.points, mid.points, outer.points);

// ---- Scroll ----
let scrollTarget = 0, scrollSmooth = 0;
window.addEventListener('scroll', () => {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  scrollTarget = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
}, { passive: true });

// ---- Pointer (perturba a camada mais próxima da câmera) ----
const mouseTarget = { x: 0, y: 0 }, mouse = { x: 0, y: 0 };
window.addEventListener('mousemove', (e) => {
  mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseTarget.y = -((e.clientY / window.innerHeight) * 2 - 1);
}, { passive: true });

const raycastPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const _ray = new THREE.Raycaster();
const _pt = new THREE.Vector3();

let azimuth = 0;
const t0 = performance.now();

function frame() {
  requestAnimationFrame(frame);
  const t = (performance.now() - t0) / 1000;

  scrollSmooth = Lerp(scrollSmooth, scrollTarget, 0.08);
  mouse.x = Lerp(mouse.x, mouseTarget.x, 0.06);
  mouse.y = Lerp(mouse.y, mouseTarget.y, 0.06);

  // Câmera orbita devagar e mergulha (dolly-in) conforme o scroll,
  // revelando as camadas internas — "descobrindo a arquitetura".
  azimuth += 0.0009;
  const dolly = Lerp(26, 9, scrollSmooth);
  camera.position.set(Math.sin(azimuth) * dolly, mouse.y * 2.2, Math.cos(azimuth) * dolly);
  camera.lookAt(0, 0, 0);

  // Rotação própria de cada camada, sentidos opostos = profundidade
  group.rotation.y = t * 0.02;
  core.points.rotation.y = t * 0.05;
  outer.points.rotation.y = -t * 0.015;

  [core, mid, outer].forEach((layer) => {
    layer.mat.uniforms.uTime.value = t;
    layer.mat.uniforms.uBreath.value = 1;
  });

  _ray.setFromCamera(mouse, camera);
  _ray.ray.intersectPlane(raycastPlane, _pt);
  if (_pt) {
    core.mat.uniforms.uCursor.value.lerp(_pt, 0.1);
    mid.mat.uniforms.uCursor.value.lerp(_pt, 0.1);
  }

  camera.layers.set(LAYERS.BLOOM);
  bloomComposer.render();
  camera.layers.set(LAYERS.SCENE);
  finalComposer.render();
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio;
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  [bloomComposer, finalComposer].forEach((c) => { c.setPixelRatio(dpr); c.setSize(w, h); });
}
window.addEventListener('resize', resize);
resize();
frame();
</script>
</body>
</html>
