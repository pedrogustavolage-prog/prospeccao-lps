<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reflexo — background 3D exclusivo, Luzuse Clínica / Ana Luiza Assis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; background:#2a1014; overflow-x:hidden; }
  #scene{ position:fixed; inset:0; width:100vw; height:100vh; }
  #scroll-host{ height:500vh; }
  #scroll-hint{
    position:fixed; bottom:28px; left:0; right:0; text-align:center;
    font-family:-apple-system,sans-serif; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:rgba(217,165,138,0.55); z-index:2; pointer-events:none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scroll-host"></div>
<div id="scroll-hint">scroll ↓</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* =====================================================================
   REFLEXO — background 3D exclusivo pra Luzuse Clínica / Ana Luiza Assis
   (leads/estetica-bh/analuizaassiis)

   Conceito, não reskin: nasce da frase que ela mesma usa na bio —
   "Existe uma versão sua que você ainda não acessou. Eu te aprimoro
   até ela." Duas nuvens de partículas, uma acima e uma abaixo de um
   plano horizontal (o "espelho d'água"), começam dessincronizadas —
   cada partícula com um deslocamento aleatório independente — e vão
   se alinhando em reflexo perfeito conforme o scroll avança. A versão
   "ainda não acessada" ganha nitidez à medida que a pessoa avança na
   página, literalizando o próprio conceito da marca. Tem lastro nas
   fotos reais dela também (reflexo d'água perfeito na Laguna del Inca,
   Chile) — não é uma metáfora abstrata forçada.

   Reaproveita só o encanamento Three.js (composer/bloom) do padrão já
   usado com a Larissa (Arquitetura Áurea) — geometria, shader de
   dessincronia e composição de câmera são exclusivos desta cena.
   ===================================================================== */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const Lerp = (a, b, t) => a + (b - a) * t;
function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16);
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}

// Paleta exclusiva desta LP — vinho profundo + dourado rosé (tons reais das fotos dela)
const COL_BG    = '#2a1014';
const COL_CORE  = '#eddcc4'; // champanhe — núcleo de luz
const COL_MID   = '#d9a58a'; // dourado rosé — camada intermediária
const COL_OUTER = '#7a3b42'; // vinho contido — camada externa

const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, alpha: false });
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL_BG);
scene.fog = new THREE.FogExp2(new THREE.Color(COL_BG).getHex(), 0.04);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 3, 24);

const LAYERS = { SCENE: 0, BLOOM: 1 };
camera.layers.enable(LAYERS.SCENE);
camera.layers.enable(LAYERS.BLOOM);

const renderPass = new RenderPass(scene, camera);

const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(renderPass);
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.65, 0.12));

const finalPass = new ShaderPass(new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null },
    bloomTexture: { value: bloomComposer.renderTarget2.texture },
    uBg: { value: hexToVec3(COL_BG) },
    uCore: { value: hexToVec3(COL_CORE) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D bloomTexture;
    uniform vec3 uBg; uniform vec3 uCore;
    varying vec2 vUv;
    void main(){
      vec2 uv = 2.0 * vUv - 1.0;
      float d = length(uv);
      vec3 vignette = uBg * (1.0 - 0.32 * d);
      vec3 glow = uCore * smoothstep(1.1, 0.0, d) * 0.09;
      vec3 base = texture2D(tDiffuse, vUv).xyz;
      vec3 bloom = texture2D(bloomTexture, vUv).xyz;
      gl_FragColor = vec4(vignette + glow + base + bloom, 1.0);
    }`,
}));
const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(renderPass);
finalComposer.addPass(finalPass);

// ---- Nuvem base: distribuída por Fibonacci sphere, achatada e erguida
// acima do plano y=0 (o "espelho"). A cópia espelhada (y invertido) é a
// versão "ainda não acessada" que só se alinha com o avanço do scroll. ----
function buildBaseGeometry(count, radius) {
  const positions = new Float32Array(count * 3);
  const seeds = new Float32Array(count);
  const offsetsUpper = new Float32Array(count * 3);
  const offsetsLower = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const y = (i / (count - 1));                 // 0 a 1 — só hemisfério norte
    const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = GOLDEN_ANGLE * i;
    positions[i * 3] = Math.cos(theta) * radiusAtY * radius;
    positions[i * 3 + 1] = 0.35 * radius + y * radius * 0.9; // erguida acima do horizonte
    positions[i * 3 + 2] = Math.sin(theta) * radiusAtY * radius;
    seeds[i] = Math.random();
    // deslocamentos aleatórios independentes pra cada cópia — a "dessincronia" inicial
    for (let k = 0; k < 3; k++) {
      offsetsUpper[i * 3 + k] = (Math.random() - 0.5) * 2;
      offsetsLower[i * 3 + k] = (Math.random() - 0.5) * 2;
    }
  }
  return { positions, seeds, offsetsUpper, offsetsLower };
}

function buildMirrorShell(base, mirrored, color, opacity, size) {
  const count = base.seeds.length;
  const positions = new Float32Array(count * 3);
  const offsets = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = base.positions[i * 3];
    positions[i * 3 + 1] = mirrored ? -base.positions[i * 3 + 1] : base.positions[i * 3 + 1];
    positions[i * 3 + 2] = base.positions[i * 3 + 2];
    const off = mirrored ? base.offsetsLower : base.offsetsUpper;
    offsets[i * 3] = off[i * 3];
    offsets[i * 3 + 1] = off[i * 3 + 1];
    offsets[i * 3 + 2] = off[i * 3 + 2];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('seed', new THREE.BufferAttribute(base.seeds, 1));
  geo.setAttribute('offsetDir', new THREE.BufferAttribute(offsets, 3));

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uColor: { value: hexToVec3(color) },
      uOpacity: { value: opacity }, uSize: { value: size },
      uMismatch: { value: 3.4 },
    },
    vertexShader: `
      attribute float seed; attribute vec3 offsetDir;
      uniform float uTime; uniform float uSize; uniform float uMismatch;
      varying float vFlicker;
      void main(){
        float breathe = 1.0 + sin(uTime * 0.5 + seed * 6.2831) * 0.035;
        vec3 p = position * breathe + offsetDir * uMismatch;
        vec4 world = modelMatrix * vec4(p, 1.0);
        vec4 mv = viewMatrix * world;
        vFlicker = 0.6 + 0.4 * sin(uTime * 1.3 + seed * 40.0);
        gl_PointSize = uSize * (1.0 / -mv.z) * (0.7 + 0.6 * seed);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity; varying float vFlicker;
      void main(){
        vec2 c = gl_PointCoord - 0.5; float l = length(c);
        if (l > 0.5) discard;
        float a = smoothstep(0.5, 0.0, l);
        gl_FragColor = vec4(uColor, a * uOpacity * vFlicker);
      }`,
  });
  const points = new THREE.Points(geo, mat);
  points.layers.enable(LAYERS.BLOOM);
  points.frustumCulled = false;
  return { points, mat };
}

const group = new THREE.Group();
scene.add(group);

const baseCore = buildBaseGeometry(650, 4.6);
const baseMid = buildBaseGeometry(950, 8.4);
const baseOuter = buildBaseGeometry(1200, 12.8);

const coreUp = buildMirrorShell(baseCore, false, COL_CORE, 0.92, 44);
const coreDown = buildMirrorShell(baseCore, true, COL_CORE, 0.92, 44);
const midUp = buildMirrorShell(baseMid, false, COL_MID, 0.5, 40);
const midDown = buildMirrorShell(baseMid, true, COL_MID, 0.5, 40);
const outerUp = buildMirrorShell(baseOuter, false, COL_OUTER, 0.3, 38);
const outerDown = buildMirrorShell(baseOuter, true, COL_OUTER, 0.3, 38);
const shells = [coreUp, coreDown, midUp, midDown, outerUp, outerDown];
shells.forEach((s) => group.add(s.points));

// Plano do "espelho d'água" — linha sutil no horizonte
const mirrorPlaneGeo = new THREE.PlaneGeometry(60, 60, 1, 1);
const mirrorPlaneMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(COL_MID), transparent: true, opacity: 0.045, side: THREE.DoubleSide });
const mirrorPlane = new THREE.Mesh(mirrorPlaneGeo, mirrorPlaneMat);
mirrorPlane.rotation.x = -Math.PI / 2;
scene.add(mirrorPlane);

// ---- Scroll: dirige o "mismatch" (dessincronia) e a câmera ----
let scrollTarget = 0, scrollSmooth = 0;
window.addEventListener('scroll', () => {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  scrollTarget = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
}, { passive: true });

let azimuth = 0;
const t0 = performance.now();

function frame() {
  requestAnimationFrame(frame);
  const t = (performance.now() - t0) / 1000;
  scrollSmooth = Lerp(scrollSmooth, scrollTarget, 0.06);

  azimuth += 0.0007;
  const dolly = Lerp(24, 11, scrollSmooth);
  camera.position.set(Math.sin(azimuth) * dolly, Lerp(3, 0.5, scrollSmooth), Math.cos(azimuth) * dolly);
  camera.lookAt(0, Lerp(1.5, 0, scrollSmooth), 0);

  group.rotation.y = t * 0.015;

  const mismatch = Lerp(3.4, 0.0, scrollSmooth); // dessincronia -> reflexo perfeito
  shells.forEach((s) => {
    s.mat.uniforms.uTime.value = t;
    s.mat.uniforms.uMismatch.value = mismatch;
  });

  camera.layers.set(LAYERS.BLOOM);
  bloomComposer.render();
  camera.layers.set(LAYERS.SCENE);
  finalComposer.render();
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio;
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  [bloomComposer, finalComposer].forEach((c) => { c.setPixelRatio(dpr); c.setSize(w, h); });
}
window.addEventListener('resize', resize);
resize();
frame();
</script>
</body>
</html>
