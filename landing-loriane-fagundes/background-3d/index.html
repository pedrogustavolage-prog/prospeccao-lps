<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Equilíbrio Espelhado — background 3D exclusivo, Dra. Loriane Fagundes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; background:#160f10; overflow-x:hidden; }
  #scene{ position:fixed; inset:0; width:100vw; height:100vh; }
  #scroll-host{ height:500vh; }
  #scroll-hint{
    position:fixed; bottom:28px; left:0; right:0; text-align:center;
    font-family:-apple-system,sans-serif; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:rgba(230,184,174,0.5); z-index:2; pointer-events:none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/three.module.js",
    "three/addons/": "../vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scroll-host"></div>
<div id="scroll-hint">scroll ↓</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* =====================================================================
   EQUILÍBRIO ESPELHADO — background 3D exclusivo pra Dra. Loriane Fagundes

   Conceito nasce do próprio vocabulário do nicho dela (harmonização facial
   / biomedicina estética): duas metades de partículas em espelho perfeito,
   respirando em sincronia ao redor de um eixo vertical de simetria — a
   ideia de equilíbrio/proporção que a harmonização facial persegue, não
   uma esfera genérica. Paleta rosé-dourado extraída da marca d'água real
   dela (monograma LF), não inventada.
   ===================================================================== */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const Lerp = (a, b, t) => a + (b - a) * t;
function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16);
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}

const COL_BG = '#160f10', COL_CORE = '#e8ab9c', COL_MID = '#c9857a', COL_OUTER = '#8a5a52';
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL_BG);
scene.fog = new THREE.FogExp2(new THREE.Color(COL_BG).getHex(), 0.028);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);

const LAYERS = { SCENE: 0, BLOOM: 1 };
camera.layers.enable(LAYERS.SCENE); camera.layers.enable(LAYERS.BLOOM);

const renderPass = new RenderPass(scene, camera);
const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(renderPass);
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.65, 0.15));

const finalPass = new ShaderPass(new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null }, bloomTexture: { value: bloomComposer.renderTarget2.texture },
    uBg: { value: hexToVec3(COL_BG) }, uCore: { value: hexToVec3(COL_CORE) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform vec3 uBg; uniform vec3 uCore;
    varying vec2 vUv;
    void main(){
      vec2 uv = 2.0 * vUv - 1.0; float d = length(uv);
      vec3 vignette = uBg * (1.0 - 0.3 * d);
      vec3 glow = uCore * smoothstep(1.1, 0.0, d) * 0.07;
      gl_FragColor = vec4(vignette + glow + texture2D(tDiffuse, vUv).xyz + texture2D(bloomTexture, vUv).xyz, 1.0);
    }`,
}));
const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(renderPass);
finalComposer.addPass(finalPass);

// Uma "asa" de partículas em formato de gota/pétala, deslocada do eixo central —
// espelhada (side = -1/+1) pra formar o par simétrico.
function buildWing(count, scaleX, scaleY, scaleZ, offsetX, side, color, opacity, sizeBase) {
  const positions = new Float32Array(count * 3), seeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const y = 1 - t * 2;
    const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = GOLDEN_ANGLE * i;
    // achata em X e estica em Z pra parecer uma pétala/asa, não uma esfera perfeita
    const px = Math.cos(theta) * radiusAtY * scaleX * (0.35 + 0.65 * Math.abs(Math.sin(t * Math.PI)));
    positions[i * 3] = side * (offsetX + Math.abs(px));
    positions[i * 3 + 1] = y * scaleY;
    positions[i * 3 + 2] = Math.sin(theta) * radiusAtY * scaleZ;
    seeds[i] = Math.random();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uColor: { value: hexToVec3(color) }, uOpacity: { value: opacity }, uSize: { value: sizeBase },
      uCursor: { value: new THREE.Vector3(9999, 9999, 9999) }, uRepel: { value: 5.5 }, uRepelStrength: { value: 1.4 },
      uBreath: { value: 0 },
    },
    vertexShader: `
      attribute float seed; uniform float uTime; uniform float uSize; uniform float uBreath;
      uniform vec3 uCursor; uniform float uRepel; uniform float uRepelStrength;
      varying float vFlicker;
      void main(){
        float breathe = 1.0 + (sin(uTime * 0.45 + seed * 6.2831) * 0.035) + uBreath;
        vec3 p = position * breathe;
        vec4 world = modelMatrix * vec4(p, 1.0);
        vec3 toCursor = world.xyz - uCursor;
        float cd = length(toCursor);
        float fall = smoothstep(uRepel, 0.0, cd);
        world.xyz += normalize(toCursor + 0.0001) * fall * uRepelStrength;
        vec4 mv = viewMatrix * world;
        vFlicker = 0.6 + 0.4 * sin(uTime * 1.2 + seed * 40.0);
        gl_PointSize = uSize * (1.0 / -mv.z) * (0.7 + 0.6 * seed);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity; varying float vFlicker;
      void main(){
        vec2 c = gl_PointCoord - 0.5; float l = length(c);
        if (l > 0.5) discard;
        float a = smoothstep(0.5, 0.0, l);
        gl_FragColor = vec4(uColor, a * uOpacity * vFlicker);
      }`,
  });
  const points = new THREE.Points(geo, mat);
  points.layers.enable(LAYERS.BLOOM); points.frustumCulled = false;
  return { points, mat };
}

const group = new THREE.Group(); scene.add(group);

// par espelhado — núcleo próximo (rosé claro) e camada externa (mauve escuro)
const coreL = buildWing(650, 6.5, 9.5, 5.5, 1.4, -1, COL_CORE, 0.85, 38);
const coreR = buildWing(650, 6.5, 9.5, 5.5, 1.4, 1, COL_CORE, 0.85, 38);
const midL = buildWing(900, 9.5, 13.5, 8.0, 2.2, -1, COL_MID, 0.45, 34);
const midR = buildWing(900, 9.5, 13.5, 8.0, 2.2, 1, COL_MID, 0.45, 34);
const outerL = buildWing(1100, 13.0, 17.5, 10.5, 3.0, -1, COL_OUTER, 0.26, 30);
const outerR = buildWing(1100, 13.0, 17.5, 10.5, 3.0, 1, COL_OUTER, 0.26, 30);
group.add(coreL.points, coreR.points, midL.points, midR.points, outerL.points, outerR.points);
const allLayers = [coreL, coreR, midL, midR, outerL, outerR];

// eixo de simetria — linha vertical de luz sutil no centro (z=0, x=0)
const axisGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(0, -14, 0), new THREE.Vector3(0, 14, 0),
]);
const axisMat = new THREE.LineBasicMaterial({ color: new THREE.Color(COL_CORE), transparent: true, opacity: 0.18 });
const axisLine = new THREE.Line(axisGeo, axisMat);
axisLine.layers.enable(LAYERS.BLOOM);
scene.add(axisLine);

function pageProgress() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  return max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
}

const mouseTarget = { x: 0, y: 0 }, mouse = { x: 0, y: 0 };
window.addEventListener('mousemove', (e) => {
  mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseTarget.y = -((e.clientY / window.innerHeight) * 2 - 1);
}, { passive: true });

const raycastPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const _ray = new THREE.Raycaster();
const _cursorWorld = new THREE.Vector3();
const _hit = new THREE.Vector3();

let azimuth = 0, running = true, rafId = null;
const t0 = performance.now();

function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio, 1.5);
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  [bloomComposer, finalComposer].forEach((c) => { c.setPixelRatio(dpr); c.setSize(w, h); });
}

function frame() {
  if (!running) return;
  rafId = requestAnimationFrame(frame);
  const t = (performance.now() - t0) / 1000;
  const progress = pageProgress();

  mouse.x = Lerp(mouse.x, mouseTarget.x, 0.05);
  mouse.y = Lerp(mouse.y, mouseTarget.y, 0.05);

  azimuth += 0.0005;
  const dolly = Lerp(26, 13, progress);
  camera.position.set(
    Math.sin(azimuth) * dolly + mouse.x * 1.6,
    Lerp(0, -1.2, progress) + Math.sin(t * 0.06) * 0.9 + mouse.y * 1.1,
    Math.cos(azimuth) * dolly
  );
  camera.lookAt(mouse.x * 0.7, mouse.y * 0.4, 0);

  // "respiração" de equilíbrio: as duas metades se aproximam e afastam do eixo em sincronia
  const breath = Math.sin(t * 0.35) * 0.06;

  _ray.setFromCamera(mouse, camera);
  if (_ray.ray.intersectPlane(raycastPlane, _hit)) _cursorWorld.lerp(_hit, 0.15);
  allLayers.forEach((l) => {
    l.mat.uniforms.uTime.value = t;
    l.mat.uniforms.uBreath.value = breath;
    l.mat.uniforms.uCursor.value.copy(_cursorWorld);
  });

  group.rotation.y = Math.sin(t * 0.05) * 0.08; // oscila, não gira 360 — mantém a simetria legível

  camera.layers.set(LAYERS.BLOOM); bloomComposer.render();
  camera.layers.set(LAYERS.SCENE); finalComposer.render();
}

document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (running) frame();
  else if (rafId) cancelAnimationFrame(rafId);
});

resize();
window.addEventListener('resize', resize);
frame();
</script>
</body>
</html>
